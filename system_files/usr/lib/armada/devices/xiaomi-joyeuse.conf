ARMADA_DEVICE_ID=xiaomi-joyeuse
ARMADA_DEVICE_NAME='Xiaomi Redmi Note 9 Pro'
ARMADA_SOC_CLASS=SM7125

# SM7125 phones do not implement a usable s2idle; the Arch bring-up used the
# fake suspend path, so pin it rather than probing mem_sleep.
ARMADA_SUSPEND_MODE=fake

# Single DSI panel; the backlight device is registered as plain "backlight".
ARMADA_PRIMARY_CONNECTOR=DSI-1
ARMADA_PRIMARY_BACKLIGHT=backlight
ARMADA_PANEL_ORIENTATION=normal

# No physical controller: the touchscreen is the only input.
ARMADA_IP_TARGETS=
