SectionVerb {
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Internal Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Digital Volume Control"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
	}
}
